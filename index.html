<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milfor · Encuentra tu mesa</title>
<style>
:root{--g:#b8963e;--k:#111}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff;color:var(--k)}
header{background:var(--k);color:#fff;text-align:center;padding:22px 12px 16px;border-bottom:3px solid var(--g)}
.logo{font-size:34px;letter-spacing:10px;color:var(--g);margin:0}.logo small{display:block;font-size:10px;letter-spacing:4px;color:#ddd}
h1{font-size:19px;font-weight:normal;margin:10px 0 2px}.f{font-size:13px;color:#ccc}
main{max-width:480px;margin:auto;padding:18px}label{font-size:14px;color:#555}
input{width:100%;font-size:18px;padding:12px;border:1px solid var(--g);border-radius:8px;margin-top:6px;font-family:inherit}
button.op{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:1px solid #ddd;background:#fafafa;border-radius:8px;font-size:16px;font-family:inherit}
.card{border:1px solid var(--g);border-radius:12px;padding:16px;text-align:center;margin-top:14px}
.num{font-size:64px;color:var(--g);line-height:1}.msg{color:#777;font-size:14px;margin-top:10px}
svg{width:100%;margin-top:12px;border:1px solid #eee;border-radius:8px}footer{text-align:center;font-size:11px;color:#999;padding:20px}
</style></head><body>
<header><p class="logo">MILFOR<small>EVENTOS</small></p><h1 id="t"></h1><div class="f" id="d"></div></header>
<main><label for="q">Escribe tu nombre para encontrar tu mesa</label>
<input id="q" autocomplete="off" placeholder="Ej.: Ana Prueba"><div id="r"></div></main>
<footer>Milfor · Encuentra tu mesa</footer>
<script src="config.js"></script>
<script src="app.js"></script></body></html>
